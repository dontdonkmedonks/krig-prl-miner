name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/krig-prl-miner:latest

      - name: Debug SaladCloud API
        run: |
          curl -X PATCH \
            "https://api.salad.com/api/public/organizations/stari/projects/Kryptex/containers/high4090" \
            -H "Salad-Api-Key: ${{ secrets.SALAD_API_KEY }}" \
            -H "Content-Type: application/merge-patch+json" \
            -d '{"container": {"image": "ghcr.io/dontdonkmedonks/krig-prl-miner:latest"}}' \
            -v
