name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Позволяет запускать сборку вручную

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/krig-prl-miner:latest

      - name: Deploy Update to SaladCloud
        uses: SaladTechnologies/sce-deploy@v0.1.1
        with:
          salad_organization: "stari"
          salad_project: "kryptex"  # ВАЖНО: строго в нижнем регистре!
          salad_container_group: "high4090"
          salad_api_key: ${{ secrets.SALAD_API_KEY }}
          image_name: "ghcr.io/${{ github.repository_owner }}/krig-prl-miner:latest"
